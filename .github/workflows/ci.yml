name: CI/CD Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  test-and-analize:
    name: Test, Migrate and SonarCloud Analysis
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:17-3.5
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin123
          POSTGRES_DB: geo_api_db
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Migrations validation
        env:
          NODE_ENV: test
          DB_USER: postgres
          DB_PASSWORD: admin123
          DB_NAME: geo_api_db
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          echo "Ejecutando migraciones..."
          npx sequelize-cli db:migrate --env test
          echo "Ejecutando seeders..."
          npx sequelize-cli db:seed:all --env test

      - name: Run Unit Tests with Coverage
        run: npm run test:unit -- --coverage
        env:
          NODE_ENV: test

      - name: sonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ===================================================================
  # Deploy a EC2 — solo en push a develop (despues de pasar los tests)
  # ===================================================================
  deploy-develop:
    name: Deploy to EC2 (develop)
    needs: test-and-analize
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/geo-api
            bash scripts/deploy.sh
